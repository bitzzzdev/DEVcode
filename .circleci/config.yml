# Builds the DEVcode binaries. The fork ships through CircleCI build artifacts only.
version: 2.1

jobs:
  build:
    parameters:
      target:
        type: string
        description: "DEVCODE_TARGET name from packages/cli/script/build.ts, e.g. linux-x64"
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install Bun 1.4.4 (pinned to packageManager)
          command: |
            curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install build tools
          command: sudo apt-get update -qq && sudo apt-get install -y -qq unzip
      - restore_cache:
          keys:
            - bun-deps-v1-{{ checksum "bun.lock" }}
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-deps-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - run:
          name: Build DEVCODE_TARGET=<< parameters.target >>
          command: |
            cd packages/cli
            DEVCODE_TARGET="<< parameters.target >>" bun run script/build.ts
      - store_artifacts:
          path: packages/cli/dist/cli-<< parameters.target >>
          destination: DEVcode-<< parameters.target >>

  rust-check:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - restore_cache:
          keys:
            - rust-toolchain-v1
      - run:
          name: Ensure Rust 1.99.1 toolchain
          command: |
            if ! command -v rustc >/dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - save_cache:
          key: rust-toolchain-v1
          paths:
            - ~/.rustup
            - ~/.cargo
      - run:
          name: Install link toolchain
          command: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
      - restore_cache:
          keys:
            - crates-target-v1-{{ checksum "crates/Cargo.lock" }}
      - run:
          name: Rust unit tests
          command: cd crates && cargo test --locked
      - save_cache:
          key: crates-target-v1-{{ checksum "crates/Cargo.lock" }}
          paths:
            - crates/target

  rust-dist:
    parameters:
      target:
        type: string
        description: "Artifact suffix, e.g. linux-x64 (matches the JS build's names)"
      triple:
        type: string
        description: "Rust target triple"
      apt:
        type: string
        description: "Space-separated apt packages providing the link toolchain"
      linker:
        type: string
        default: ""
        description: "Cross gcc to point CARGO_TARGET_<TRIPLE>_LINKER at (empty: rustc self-contained musl link via cc)"
      ring_cc:
        type: string
        default: ""
        description: "musl-target C compiler for the ring build script (CC_<TRIPLE> env var)"
      rustflags:
        type: string
        default: ""
        description: "RUSTFLAGS for the build (empty for default tuning)"
      smoke:
        type: boolean
        default: false
        description: "Run the produced binary --version (x86_64 rows)"
      musl_cc:
        type: boolean
        default: false
        description: "Install the musl cross toolchain from musl.cc"
      musl_arch:
        type: string
        default: "x86_64"
        description: "musl.cc cross toolchain arch (x86_64 or aarch64)"
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - restore_cache:
          keys:
            - rust-toolchain-v1
      - run:
          name: Ensure Rust 1.99.1 toolchain + target
          command: |
            if ! command -v rustc >/dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/.cargo/bin/rustup" target add "<< parameters.triple >>"
      - save_cache:
          key: rust-toolchain-v1
          paths:
            - ~/.rustup
            - ~/.cargo
      - run:
          name: Install link toolchain
          command: |
            if [ -n "<< parameters.apt >>" ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq << parameters.apt >>
            fi
      - when:
          condition: << parameters.musl_cc >>
          steps:
            - restore_cache:
                keys:
                  - musl-cc-<< parameters.musl_arch >>-v1
            - run:
                name: Install musl.cc << parameters.musl_arch >> cross toolchain
                command: |
                  if [ ! -x "$HOME/<< parameters.musl_arch >>-linux-musl-cross/bin/<< parameters.musl_arch >>-linux-musl-gcc" ]; then
                    curl --proto '=https' --tlsv1.2 -fsSL -o "$HOME/<< parameters.musl_arch >>-linux-musl-cross.tgz" "https://musl.cc/<< parameters.musl_arch >>-linux-musl-cross.tgz"
                    tar -xzf "$HOME/<< parameters.musl_arch >>-linux-musl-cross.tgz" -C "$HOME"
                    rm "$HOME/<< parameters.musl_arch >>-linux-musl-cross.tgz"
                  fi
                  echo "export PATH=\"$HOME/<< parameters.musl_arch >>-linux-musl-cross/bin:\$PATH\"" >> "$BASH_ENV"
            - save_cache:
                key: musl-cc-<< parameters.musl_arch >>-v1
                paths:
                  - ~/<< parameters.musl_arch >>-linux-musl-cross
      - restore_cache:
          keys:
            - crates-dist-v1-{{ checksum "crates/Cargo.lock" }}-<< parameters.target >>
      - run:
          name: Build rust DEVcode (<< parameters.target >>)
          command: |
            if [ -n "<< parameters.linker >>" ]; then
              triple_env=$(printf '%s' "<< parameters.triple >>" | tr 'a-z-' 'A-Z_')
              export "CARGO_TARGET_${triple_env}_LINKER=<< parameters.linker >>"
            fi
            if [ -n "<< parameters.rustflags >>" ]; then
              export RUSTFLAGS="<< parameters.rustflags >>"
            fi
            cd crates
            cargo build --release --locked --target "<< parameters.triple >>"
      - save_cache:
          key: crates-dist-v1-{{ checksum "crates/Cargo.lock" }}-<< parameters.target >>
          paths:
            - crates/target
      - run:
          name: Verify binary (<< parameters.target >>)
          command: |
            binary=crates/target/<< parameters.triple >>/release/DEVcode
            test -x "$binary"
            ls -lh "$binary"
            if [ "<< parameters.smoke >>" = "true" ]; then
              "$binary" --version
            fi
      - store_artifacts:
          path: crates/target/<< parameters.triple >>/release/DEVcode
          destination: DEVcode-rust-<< parameters.target >>

workflows:
  build:
    jobs:
      - build:
          name: DEVcode-<< matrix.target >>
          matrix:
            parameters:
              target:
                - linux-x64
                - linux-x64-baseline
                - linux-x64-musl
                - linux-x64-baseline-musl
                - linux-arm64
                - linux-arm64-musl
      - rust-check:
          filters:
            branches:
              only: rust-port
      - rust-dist:
          name: DEVcode-rust-linux-x64
          target: linux-x64
          triple: x86_64-unknown-linux-gnu
          apt: build-essential
          rustflags: "-C target-cpu=x86-64-v3"
          smoke: true
          filters:
            branches:
              only: rust-port
      - rust-dist:
          name: DEVcode-rust-linux-x64-baseline
          target: linux-x64-baseline
          triple: x86_64-unknown-linux-gnu
          apt: build-essential
          smoke: true
          filters:
            branches:
              only: rust-port
      - rust-dist:
          name: DEVcode-rust-linux-x64-musl
          target: linux-x64-musl
          triple: x86_64-unknown-linux-musl
          apt: ""
          musl_cc: true
          musl_arch: x86_64
          linker: x86_64-linux-musl-gcc
          rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+crt-static"
          smoke: true
          filters:
            branches:
              only: rust-port
      - rust-dist:
          name: DEVcode-rust-linux-x64-baseline-musl
          target: linux-x64-baseline-musl
          triple: x86_64-unknown-linux-musl
          apt: ""
          musl_cc: true
          musl_arch: x86_64
          linker: x86_64-linux-musl-gcc
          rustflags: "-C target-feature=+crt-static"
          smoke: true
          filters:
            branches:
              only: rust-port
      - rust-dist:
          name: DEVcode-rust-linux-arm64
          target: linux-arm64
          triple: aarch64-unknown-linux-gnu
          apt: gcc-aarch64-linux-gnu
          linker: aarch64-linux-gnu-gcc
          filters:
            branches:
              only: rust-port
      - rust-dist:
          name: DEVcode-rust-linux-arm64-musl
          target: linux-arm64-musl
          triple: aarch64-unknown-linux-musl
          apt: ""
          musl_cc: true
          musl_arch: aarch64
          linker: aarch64-linux-musl-gcc
          rustflags: "-C target-feature=+crt-static"
          filters:
            branches:
              only: rust-port
