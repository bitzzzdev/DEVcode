[package]
name = "devcode-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "devcode_tui"
path = "src/lib.rs"

[dependencies]
devcode-util = { path = "../util" }
devcode-service = { path = "../service" }
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2.12", features = ["json"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
