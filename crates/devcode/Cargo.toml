[package]
name = "devcode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "DEVcode"

[[bin]]
name = "DEVcode"
path = "src/main.rs"

[dependencies]
devcode-util = { path = "../util" }
devcode-service = { path = "../service" }
devcode-core = { path = "../core" }
devcode-ai = { path = "../ai" }
devcode-tools = { path = "../tools" }
devcode-runner = { path = "../runner" }
devcode-tui = { path = "../tui" }
devcode-plugin = { path = "../plugin" }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tiny_http = "0.12"
base64 = "0.22"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
